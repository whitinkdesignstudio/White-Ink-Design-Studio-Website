<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="50%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F3EFE9" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C085" />
      <stop offset="50%" stop-color="#B88746" />
      <stop offset="100%" stop-color="#9E7234" />
    </linearGradient>

    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88746" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E4C085" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#9E7234" stop-opacity="0.9" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#8C7355" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="300" r="230" fill="#B88746" opacity="0.08" />

  <!-- Background Growth Chart Grid -->
  <g opacity="0.35" stroke="#D5C7B5" stroke-width="1.5">
    <line x1="120" y1="460" x2="680" y2="460" />
    <line x1="120" y1="360" x2="680" y2="360" stroke-dasharray="4 6" />
    <line x1="120" y1="260" x2="680" y2="260" stroke-dasharray="4 6" />
    <line x1="120" y1="160" x2="680" y2="160" stroke-dasharray="4 6" />
  </g>

  <!-- Soaring Conversion Trend Curve -->
  <path d="M 140 450 Q 280 430, 420 300 T 660 140" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" filter="url(#shadow)" />
  <circle cx="660" cy="140" r="10" fill="#B88746" />
  <circle cx="660" cy="140" r="5" fill="#FFFFFF" />

  <!-- Funnel Visual (Center Left) -->
  <g filter="url(#shadow)" transform="translate(140, 150)">
    <!-- Top Funnel Ring (Impression / Traffic) -->
    <ellipse cx="140" cy="50" rx="110" ry="24" fill="#FFFFFF" stroke="#B88746" stroke-width="3" />
    <text x="140" y="55" fill="#B88746" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">1. IMPRESSIONS &amp; ADS</text>

    <!-- Funnel Body -->
    <path d="M 30 50 L 90 190 C 90 200, 190 200, 190 190 L 250 50 Z" fill="url(#funnelGrad)" opacity="0.25" />
    <path d="M 30 50 L 90 190" stroke="#B88746" stroke-width="3" />
    <path d="M 250 50 L 190 190" stroke="#B88746" stroke-width="3" />

    <!-- Middle Funnel Ring (Clicks / Intent) -->
    <ellipse cx="140" cy="120" rx="75" ry="16" fill="#FAF8F5" stroke="#C59A58" stroke-width="2.5" />
    <text x="140" y="124" fill="#141414" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. CLICK THROUGH</text>

    <!-- Bottom Spout Ring (Orders / Revenue) -->
    <ellipse cx="140" cy="190" rx="50" ry="12" fill="#FFFFFF" stroke="#9E7234" stroke-width="3" />
    <text x="140" y="194" fill="#9E7234" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">3. HIGH ROAS</text>

    <!-- Sales Drops -->
    <path d="M 140 220 L 140 270" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8" />
  </g>

  <!-- Floating Sponsored Ad Card (Center Right) -->
  <g filter="url(#shadow)" transform="translate(420, 180)">
    <rect width="250" height="280" rx="18" fill="#FFFFFF" stroke="#E8DED0" stroke-width="2" />
    
    <!-- Sponsored Pill Header -->
    <rect x="20" y="20" width="88" height="22" rx="11" fill="#FAF8F5" stroke="#E8DED0" />
    <circle cx="32" cy="31" r="3.5" fill="#B88746" />
    <text x="44" y="35" fill="#77716A" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SPONSORED</text>

    <!-- Ad Creative Mockup Box -->
    <rect x="20" y="52" width="210" height="110" rx="10" fill="#FAF8F5" stroke="#E8DED0" />
    <!-- Product bottle outline inside ad -->
    <rect x="100" y="70" width="30" height="60" rx="6" fill="#FFFFFF" stroke="#B88746" stroke-width="2" />
    <rect x="107" y="60" width="16" height="10" rx="2" fill="url(#goldGrad)" />
    <line x1="105" y1="92" x2="125" y2="92" stroke="#B88746" stroke-width="1.5" />

    <!-- Ad Headline -->
    <rect x="20" y="174" width="130" height="12" rx="3" fill="#141414" />
    <rect x="20" y="194" width="180" height="8" rx="2" fill="#D5C7B5" />

    <!-- Conversion Metric & CTA -->
    <g transform="translate(20, 220)">
      <text x="0" y="24" fill="#B88746" font-family="system-ui, sans-serif" font-size="20" font-weight="900">4.8X</text>
      <text x="46" y="22" fill="#77716A" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ROAS</text>

      <!-- Shop Now Button -->
      <rect x="100" y="4" width="110" height="34" rx="17" fill="url(#goldGrad)" />
      <text x="155" y="25" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">SHOP NOW →</text>
    </g>
  </g>

  <!-- Floating Discount Shopping Tag -->
  <g filter="url(#shadow)" transform="translate(620, 90) rotate(14)">
    <polygon points="0,0 60,0 80,30 60,60 0,60" fill="#FFFFFF" stroke="#B88746" stroke-width="2" />
    <circle cx="16" cy="30" r="5" fill="#FAF8F5" stroke="#B88746" stroke-width="1.5" />
    <text x="45" y="36" fill="#B88746" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">%</text>
  </g>
</svg>

